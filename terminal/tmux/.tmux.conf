set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

unbind C-b
set-option -g prefix C-v
bind-key C-v send-prefix

# Directory new panes open in: the pane's shell directory, or when the pane is
# running nvim, the folder of the file open there (nvim publishes @nvim_dir).
%hidden PANE_DIR="#{?#{&&:#{==:#{pane_current_command},nvim},#{@nvim_dir}},#{@nvim_dir},#{pane_current_path}}"

# Prefix Bindings
bind-key d kill-pane
bind-key f kill-window

# Direct Bindings (NO Prefix Needed)
bind-key -n C-d split-window -v -c "$PANE_DIR"
bind-key -n C-t split-window -h -c "$PANE_DIR"
bind-key -n C-f new-window -c "$PANE_DIR"
# C-w parks the pane (process keeps running) so prefix T / Cmd+Shift+T can
# reopen it. prefix d still kills for good.
bind-key -n C-w run-shell "~/.tmux/scripts/close-pane.sh '#{pane_id}' '#{session_windows}' '#{window_panes}'"
bind-key -n C-g previous-window
bind-key -n C-q select-pane -t :.+

# iTerm sends these for Cmd shortcuts (prefix + key), see terminal/iterm.
# Cmd+Shift+T: reopen the last closed pane
bind-key T run-shell "~/.tmux/scripts/reopen-pane.sh '#{session_name}'"
# Cmd+F: search this pane's scrollback (inside nvim, nvim's own / search)
bind-key / if-shell -F '#{==:#{pane_current_command},nvim}' {
  send-keys /
} {
  copy-mode
  command-prompt -i -p "(search up)" { send-keys -X search-backward-incremental "%%" }
}
# Cmd+Shift+F: grep the whole repo, open the hit in nvim
bind-key F display-popup -E -w 90% -h 85% -d "$PANE_DIR" "~/.tmux/scripts/grep.sh '$PANE_DIR' '#{pane_id}' '#{pane_current_command}'"
# prefix g: lazygit for the repo this pane is in
bind-key g display-popup -E -w 90% -h 90% -d "$PANE_DIR" lazygit

# Parked panes would otherwise keep the server alive after the last real
# session ends.
set-hook -g session-closed "if-shell -F '#{==:#{server_sessions},1}' 'kill-session -t _closed'"

set-option -g status-position top
set-option -g status-left " #[bold]#S#[nobold]  "
set-option -g status-right " Gurbax's MacBook  %y-%m-%d %I:%M %p "
set-option -g status-left-length 30
set-option -g status-right-length 60
set-option -g window-status-format " #I:#W "
set-option -g window-status-current-format " #[bold]#I:#W#[nobold] "

set-option -g history-limit 10000

set-option -g mouse on

set-option -g repeat-time 200

set -g mode-style "bg=#b4d5ff,fg=#000000"
set -g status-style "bg=#1f2428,fg=#9afba1"
set -g window-status-current-style "bg=#1f2428,fg=#73ceff"
set -g window-status-style "bg=#1f2428,fg=#9afba1"
set -g status-left-style "bg=#1f2428,fg=#9afba1"
set -g status-right-style "bg=#1f2428,fg=#9afba1"
